name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            output: cmdo-windows.exe
          - os: ubuntu-latest
            output: cmdo-linux
          - os: macos-latest
            output: cmdo-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Set up C++ compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Set up C++ compiler
        if: runner.os == 'macOS'
        run: |
          # macOS has clang by default
          echo "Using clang"

      - name: Set up C++ compiler
        if: runner.os == 'Windows'
        run: |
          echo "Using g++"

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          g++ -std=c++20 -I . -Wall -Wextra -O2 -static app/main.cpp projected_gradient_optimizer.cpp utils/grid_generator.cpp -o cmdo-windows.exe

      - name: Build on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          g++ -std=c++20 -I . -Wall -Wextra -O2 -static app/main.cpp projected_gradient_optimizer.cpp utils/grid_generator.cpp -o cmdo-linux

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: |
          g++ -std=c++20 -I . -Wall -Wextra -O2 -static-libstdc++ app/main.cpp projected_gradient_optimizer.cpp utils/grid_generator.cpp -o cmdo-darwin

      - name: Check Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "= list windows artifact ="
          ls -la cmdo-windows.exe

      - name: Check Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "= list linux artifact ="
          ls -la cmdo-linux

      - name: Check macOS artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "= list macos artifact ="
          ls -la cmdo-darwin

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cmdo-windows.exe
            cmdo-linux
            cmdo-darwin